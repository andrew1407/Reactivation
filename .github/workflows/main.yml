name: Tests

# Runs the edit- and play-mode test suites; the platform builds live in packages.yml
on:
  push:
    branches: [main]
    # Only what the tests compile or load: README, docs, the notebook and the Blender sources
    # under Models/ change nothing they run, so pushes touching only those start no job
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # unity-test-runner publishes its results as a check run

# A newer push to the same ref supersedes an in-flight run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - playmode
          - editmode
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-test-
            Library-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # Personal licenses activate with the account itself (manual .alf activation is gone):
          # UNITY_LICENSE is the contents of the .ulf from a local activation
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} Test Results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Test results for ${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
